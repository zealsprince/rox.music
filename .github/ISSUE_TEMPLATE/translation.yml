name: Translation
description: Website copy that reads wrong in your language, or a language the site doesn't speak yet
labels: [i18n]
body:
  - type: markdown
    attributes:
      value: >
        Site copy lives in
        [`src/locales`](https://github.com/zealsprince/rox.music/tree/main/src/locales),
        one `rox.ftl` per language, with `en-CA` as the source that carries every
        key. Worth a peek there first: if it already reads right on `main`, the
        fix just hasn't deployed yet. This template is for the website only. If
        the string you're looking at is inside the rox app rather than on a page,
        file it in [zealsprince/rox](https://github.com/zealsprince/rox/issues)
        instead.
  - type: dropdown
    id: language
    attributes:
      label: Which language?
      options:
        - Deutsch (de)
        - Français (fr)
        - Italiano (it)
        - English (en-CA)
        - One the site doesn't have yet
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Which page?
      description: The URL you're looking at, locale prefix and all. English pages have no prefix.
      placeholder: https://rox.music/de/download
  - type: textarea
    id: what
    attributes:
      label: What's off, or what's missing?
      description: >
        Quote the string as it shows today and where on the page it sits, then
        what a native speaker would say instead. English leaking through into a
        translated page counts too, as does anything that's technically correct
        but reads like a machine wrote it. Proposing a new language? Name it, and
        say whether you'd want to translate it yourself.
      placeholder: The download page says "..." but it should say "..."
    validations:
      required: true
