name: Snapshot download counts

# GitHub reports download counts as a running total and keeps no history behind
# them, so a downloads-over-time chart only exists if something writes the
# number down. This is that: one row a day appended to
# src/data/downloads.history.json and committed. Git is the store.
#
# It runs an hour before the deploy cron rather than triggering a deploy itself.
# Commits made with the default GITHUB_TOKEN deliberately do not fire other
# workflows, so a push from here would never reach deploy.yml no matter how its
# triggers were written, and the usual workaround is a personal access token
# with write scope sitting in the repo forever. The clock is cheaper: snapshot
# at 05:17, deploy at 06:17, the new row is live an hour later.
#
# Deliberately not folded into deploy.yml. That workflow runs on every push and
# every pull request, which would sample at whatever irregular rate the repo
# happens to be worked on, add a commit per push, and hand contents: write to
# builds triggered by pull requests.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Same reason deploy.yml passes it: the anonymous API allows 60 requests
      # an hour per IP and shared runners get through that faster than you would
      # think.
      - name: Snapshot
        run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The fallback rides along in the same commit. It is what a build reads
      # when the API is down, and one refreshed daily is worth more than one
      # refreshed whenever somebody remembers.
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/downloads.history.json src/data/downloads.fallback.json
          # A quiet day still rewrites the row for today, so an unchanged tree
          # is a normal outcome and not a failure. Written as an if rather than
          # `git diff --quiet && exit 0`, which under set -e fails the step on
          # the branch where there *are* changes.
          if git diff --cached --quiet; then
            echo 'counts unchanged, nothing to commit'
            exit 0
          fi
          git commit -m 'Snapshot download counts'
          git push
